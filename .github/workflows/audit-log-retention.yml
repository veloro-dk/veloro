name: Audit Log Retention

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: http://localhost:3000
      AUDIT_LOG_RETENTION_DAYS: ${{ vars.AUDIT_LOG_RETENTION_DAYS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Skip when DATABASE_URL is missing
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret is not configured. Skipping audit log retention run."

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: npm ci

      - name: Run audit log retention
        if: env.DATABASE_URL != ''
        run: npm run job:audit-log-retention
